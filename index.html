<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cartographer · 世界地图生成器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body data-module="home">
    <div id="home">
      <div class="home-inner">
        <div class="home-brand">
          <h1>Cartographer</h1>
          <p>为你的世界观绘制地图：从整片大陆的山川气候，到一座城镇的街巷。</p>
        </div>
        <div class="home-cards">
          <button class="home-card" data-go="world">
            <div class="hc-art hc-world"></div>
            <div class="hc-body">
              <div class="hc-title">世界地图</div>
              <div class="hc-desc">板块造山、侵蚀水系、气候与群系。3D 沙盘、六种纸图风格，并可在编辑视图里改地形、气候、大洲与地点。</div>
            </div>
          </button>
          <button class="home-card" data-go="settlement">
            <div class="hc-art hc-town"></div>
            <div class="hc-body">
              <div class="hc-title">聚落地图 <span class="hc-tag">开发中</span></div>
              <div class="hc-desc">为一座城市、镇子或村庄生成街区级平面图：城墙、街道、街区、地块与地标，可继承世界地图上的地形。</div>
            </div>
          </button>
        </div>
        <div class="home-foot"><button id="home-open">打开项目文件…</button></div>
      </div>
    </div>
    <div id="app">
      <aside id="panel">
        <header class="brand">
          <div class="brand-top">
            <h1 id="go-home" title="回到首页">Cartographer</h1>
            <div class="file">
              <button id="open" title="打开项目文件">打开</button>
              <button id="save" title="保存种子、参数与全部编辑">保存</button>
              <input id="open-file" type="file" accept=".json,application/json" hidden />
            </div>
          </div>
          <nav class="modules" id="modules">
            <button data-mod="world" class="on">世界地图</button>
            <button data-mod="settlement">聚落地图</button>
          </nav>
        </header>
        <div class="scroll">
          <section class="gen">
            <div class="seed-box">
              <input id="seed" spellcheck="false" autocomplete="off" placeholder="输入种子" title="同一种子总是生成同一个世界" />
              <button id="dice" title="随机种子并生成（R）">随机</button>
            </div>
            <div class="presets" id="presets"></div>
            <button id="generate" class="primary">生成世界</button>
            <details id="advanced">
              <summary>高级参数</summary>
              <div id="world-controls"></div>
              <button id="reset" class="link">恢复默认参数</button>
            </details>
          </section>
          <section id="info" class="hidden">
            <div class="world-name" id="world-name"></div>
            <div class="stats" id="stats"></div>
          </section>
          <section id="ctl-3d">
            <h2>沙盘</h2>
            <div id="view-3d"></div>
          </section>
          <section id="ctl-edit" class="hidden">
            <h2>编辑</h2>
            <div class="tool-grid" id="edit-tools"></div>
            <div class="row">
              <label>底图</label>
              <select id="edit-view">
                <option value="auto">随画笔切换</option>
                <option value="relief">地貌</option>
                <option value="elevation">海拔 · 等高线</option>
                <option value="temperature">气温</option>
                <option value="rain">降水</option>
                <option value="regions">大洲</option>
              </select>
            </div>
            <div id="brush-opts"></div>
            <div id="region-panel" class="hidden">
              <div id="region-neck"></div>
              <button id="region-auto" class="wide" title="在窄于「地峡宽度」的地方把陆地切开，每块大陆核心各成一洲">自动划分大洲</button>
              <div id="region-insp" class="hidden">
                <div class="row"><label>中文名</label><input id="region-zh" spellcheck="false" /></div>
                <div class="row"><label>原名</label><input id="region-name" spellcheck="false" /></div>
                <button id="region-delete" class="danger">删除这个大洲</button>
              </div>
            </div>
            <label class="check"><input type="checkbox" id="edit-names" checked /> 显示地名</label>
            <div class="edit-actions">
              <button id="edit-undo" title="撤销（Ctrl+Z）">撤销</button>
              <button id="edit-clear" title="清除全部编辑">清除编辑</button>
            </div>
            <div id="inspector" class="hidden">
              <h2>地点</h2>
              <div class="row"><label>中文名</label><input id="insp-zh" spellcheck="false" /></div>
              <div class="row"><label>原名</label><input id="insp-name" spellcheck="false" /></div>
              <div class="row"><label>类型</label><select id="insp-kind"></select></div>
              <button id="insp-delete" class="danger" title="删除（Delete）">删除地点</button>
            </div>
          </section>
          <section id="ctl-2d" class="hidden">
            <h2>纸图风格</h2>
            <div id="view-2d"></div>
          </section>
        </div>
        <footer class="export">
          <button id="export" title="导出当前视图的图片">导出 PNG</button>
          <button id="export-svg" class="hidden" title="纸图的矢量版本，可无损放大">导出 SVG</button>
        </footer>
      </aside>
      <main id="stage">
        <div id="view3d" class="view"></div>
        <div id="view2d" class="view hidden"></div>
        <div id="viewEdit" class="view hidden"></div>
        <div id="edit-status" class="hidden"></div>
        <div class="switch" id="switch">
          <button data-view="3d" class="on">3D 沙盘</button>
          <button data-view="2d">纸图</button>
          <button data-view="edit">编辑</button>
        </div>
        <div id="probe" class="hidden"></div>
        <div id="hint">拖动旋转 · 右键平移 · 滚轮缩放 · P 性能</div>
        <div id="loading">
          <div class="load-card">
            <div class="load-title">正在塑造世界</div>
            <div class="load-stage" id="load-stage">…</div>
            <div class="bar"><i id="load-bar"></i></div>
          </div>
        </div>
      </main>
      <main id="settlement">
        <div class="placeholder">
          <div class="ph-title">聚落地图</div>
          <p>为一座城市、镇子或村庄生成街区级的平面图：城墙与城门、街道与街区、地块与房屋、广场与地标。</p>
          <p class="ph-note">正在开发中。完成后可以单独使用，也可以从世界地图上选一个地点，继承那里的地形、河流与海岸。</p>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
