# 推送到 main：检查更新日志、构建并部署到 GitHub Pages。
# 打 v* 标签（发版）：检查更新日志、构建，再按 src/changelog.ts 创建 GitHub Release（部署仍由 main 的推送完成：
# Pages 的部署环境只放行默认分支）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:notes --check
      - run: pnpm check:arch
      - run: pnpm check:dmath
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 发版：三语更新日志写进 GitHub Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm -s release:notes "$GITHUB_REF_NAME" > notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release edit "$GITHUB_REF_NAME" --notes-file notes.md \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
